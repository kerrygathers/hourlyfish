name: 🐟 HourlyFish — Hourly Post

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'

  # Lets you manually trigger a test run from the Actions tab
  workflow_dispatch:

jobs:
  post-fish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit counter.txt back to the repo

    steps:
      # ── 1. Check out the repo (including the current counter.txt) ──────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use a token with write access so we can push back the counter
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: pip install requests beautifulsoup4 atproto

      # ── 4. Run the bot ───────────────────────────────────────────────────────
      - name: Post fish to Bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: python bot.py

      # ── 5. Commit the updated counter back to the repo ───────────────────────
      #    The "|| echo" at the end prevents failure if nothing changed
      #    (e.g. on a dry run where the post was skipped).
      - name: Save counter
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add counter.txt
          git diff --cached --quiet || git commit -m "chore: advance fish counter [skip ci]"
          git push
